<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SenHub Agent documentation has moved</title>
    <meta name="robots" content="noindex" />
    <script>
      // Path-preserving redirect: docs.senhub.io/<path> -> agent.senhub.io/docs/<path>
      // Old pages already lived under /docs/... so the full pathname is appended.
      (function () {
        var target =
          "https://agent.senhub.io/docs" +
          location.pathname +
          location.search +
          location.hash;
        var canonical = document.createElement("link");
        canonical.rel = "canonical";
        canonical.href = target;
        document.head.appendChild(canonical);
        var a = document.getElementById("l");
        if (a) a.href = target;
        location.replace(target);
      })();
    </script>
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #fbfbfd;
        color: #212529;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        margin: 0;
        text-align: center;
        padding: 24px;
      }
      a { color: #0091bd; font-weight: 600; }
    </style>
  </head>
  <body>
    <p>
      This page has moved to
      <a id="l" href="https://agent.senhub.io/docs/">agent.senhub.io/docs</a>.
      Redirecting…
    </p>
  </body>
</html>
